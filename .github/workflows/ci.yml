name: AeDoit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Production runs on PostgreSQL, so CI does too — a SQLite build hides provider mismatches
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aedoit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aedoit_ci"
      SHADOW_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aedoit_ci_shadow"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Generate Prisma Database Schema
        run: npx prisma generate

      - name: Apply Migrations to PostgreSQL
        run: npx prisma migrate deploy

      - name: Check Migrations Match Schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE aedoit_ci_shadow'
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code

      - name: Verify Production Next.js Build
        run: npm run build
        env:
          SESSION_SECRET: "ci_testing_session_secret_min_32_chars!"
          MASTER_PASSWORD: "ci_test_password_2026"
